[package]
name = "snail-rt"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Snail async runtime (tokio): the session orchestrator over snail-core's neutral surface."

[dependencies]
snail-core = { path = "../snail-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "test-util"] }
