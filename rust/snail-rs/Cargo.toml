[package]
name = "snail-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "PyO3 bindings exposing snail-core's Rust audio plane + endpointing VAD to Python."

[lib]
name = "snail_rs"
crate-type = ["cdylib"]

[dependencies]
snail-core = { path = "../snail-core" }
pyo3 = { version = "0.29", features = ["extension-module"] }
